name: Publish approved pre-release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, exactly v + package.json version
        required: true
        type: string
      publish:
        description: I approve publishing this validated experimental release
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: game-hub-release
  cancel-in-progress: false
jobs:
  release:
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: python -m unittest discover -s tests -p test_updates.py
      - run: python scripts/package-public.py
      - name: Verify tag and package metadata
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/release-manifest.py "$RELEASE_TAG"
      - name: Publish downloadable assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --title "Game Hub $RELEASE_TAG — experimental preview" --notes-file RELEASE-NOTES.md ../Game-Hub-*-decky.zip ../Game-Hub-*-source.zip ../game-hub-update.json ../SHA256SUMS.txt
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
