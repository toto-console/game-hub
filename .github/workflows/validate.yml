name: Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: python -m unittest discover -s tests -p test_updates.py
      - run: python scripts/package-public.py
      - run: python scripts/release-manifest.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validated-build
          path: |
            ../Game-Hub-*-decky.zip
            ../Game-Hub-*-source.zip
            ../game-hub-update.json
            ../SHA256SUMS.txt
          if-no-files-found: error
